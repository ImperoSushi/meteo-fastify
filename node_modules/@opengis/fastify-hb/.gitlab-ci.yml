stages:
  - pull

latest-253:
  stage: pull
  tags:
    - cdn
  variables:
    GIT_STRATEGY: none
  script:
    - cd /data/softpro/docs/fastify-hb && git reset --hard && git pull origin main
    - npm install
    - npm run docs:build
    - rm -rf /data/softpro/apidocs/fastify-hb || true
    - mkdir -p /data/softpro/apidocs/fastify-hb || true
    - cp -R ./docs/.vitepress/dist/* /data/softpro/apidocs/fastify-hb
  only:
    - main
